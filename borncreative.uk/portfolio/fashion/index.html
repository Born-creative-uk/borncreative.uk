<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Our Store</title>
  <meta name="description" content="Quality products built to last. Shop our latest range now.">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111827;
      --brand: #f59e0b;
      --paper: #ffffff;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      overflow-x: hidden;
    }

    /* Hero section */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.15)), url('assets/hero.jpg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
    }

        .hero-content {
      position: relative;
      z-index: 1;
      background: none;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
      max-width: 800px;
    }

        h1 {
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.1;
    }

    /* Rotating word effect */
    #swapword {
      display: inline-block;
      transition: opacity .3s ease, transform .3s ease;
      will-change: opacity, transform;
    }
    #swapword.is-out {
      opacity: 0;
      transform: translateY(.4em);
    }

        p {
      font-size: 1.8rem;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: var(--brand);
      color: #111;
      font-weight: 700;
      padding: 14px 34px;
      border-radius: 999px;
      text-decoration: none;
      transition: transform .25s ease, box-shadow .25s ease;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,.25);
    }

    /* Newsletter */
    .newsletter {
      padding: 64px 20px;
      display: flex;
      justify-content: center;
      background: var(--paper);
    }
    .newsletter-card {
      width: 100%;
      max-width: 860px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      background: #fff;
      text-align: center;
    }
    .newsletter h2 {
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      margin-bottom: 12px;
    }
    .newsletter p.subcopy {
      color: #6b7280;
      margin-bottom: 20px;
      font-size: 1rem;
    }
    .newsletter form {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .newsletter input[type="email"] {
      min-width: 260px;
      padding: 14px 16px;
      font-size: 1rem;
      border-radius: 999px;
      border: 2px solid #e5e7eb;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .newsletter input[type="email"]:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, .2);
    }
    .btn-news {
      background: var(--brand);
      color: #111;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 999px;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
      box-shadow: var(--shadow);
    }
    .btn-news:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.25); }

    footer {
      background: var(--paper);
      color: var(--ink);
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    /* Top demo banner */
    .top-banner {
      width: 100%;
      background: var(--brand);
      color: #111;
      text-align: center;
      font-weight: 600;
      padding: 10px 16px;
      font-size: 14px;
    }

    /* Visually hidden (for screen readers) */
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }

    /* Mobile tweaks */
    @media (max-width: 640px) {
      h1 { font-size: clamp(2.75rem, 12vw, 4.5rem); }
      p { font-size: 1.25rem; }
      .hero { padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
      .newsletter-card { padding: 20px; }
      .newsletter form { flex-direction: column; align-items: stretch; }
      .newsletter input[type="email"], .newsletter .btn-news { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="top-banner">This is a demonstration page only.</div>

  <section class="hero">
    <div class="hero-content">
      <h1> <span id="swapword">Quality</span></h1>
      <p><span id="typewriter" aria-label="Handcrafted pieces,&#10;designed in Runcorn"></span></p>
      <a href="#shop" class="btn">Shop Now</a>
    </div>
  </section>
 
  <section class="newsletter" id="newsletter">
    <div class="newsletter-card" role="region" aria-label="Newsletter signup">
      <h2>Stay in the loop</h2>
      <p class="subcopy">Join our newsletter for new drops, behind-the-scenes, and exclusive offers.</p>
      <form action="#" method="post">
        <label for="email" class="sr-only">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
        <button type="submit" class="btn-news">Subscribe</button>
      </form>
    </div>
  </section>

  <footer>
    Â© <span id="year"></span> Your Company. All rights reserved.
  </footer>

  <script>
    (function(){
      const footer = document.querySelector('footer');
      if (footer) {
        footer.innerHTML = '&copy; <span id="year"></span> Your Company. All rights reserved.';
      }
      const y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();
    })();
  </script>

  <script>
    (function() {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const el = document.getElementById('swapword');
      if (!el) return;
      const words = ['Quality', 'Bold', 'Tailored', 'Timeless'];
      let i = 0;
      const duration = 1600; // ms between swaps
      const transition = 300; // ms must match CSS
      setInterval(() => {
        el.classList.add('is-out');
        setTimeout(() => {
          i = (i + 1) % words.length;
          el.textContent = words[i];
          el.classList.remove('is-out');
        }, transition);
      }, duration);
    })();
  </script>

  <script>
    (function() {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const el = document.getElementById('typewriter');
      if (!el) return;
      const full = el.getAttribute('aria-label') || 'All on one website';
      el.textContent = '';
      el.style.display = 'inline-block';
      el.style.whiteSpace = 'pre-line';
      el.style.overflow = 'hidden';
      el.style.borderRight = '2px solid currentColor';
      let caretVisible = true;
      setInterval(() => {
        caretVisible = !caretVisible;
        el.style.borderRightColor = caretVisible ? getComputedStyle(el).color : 'transparent';
      }, 850);
      let i = 0;
      const speed = 90; // ms per character
      (function type() {
        if (i < full.length) {
          el.textContent += full.charAt(i++);
          setTimeout(type, speed);
        }
      })();
    })();
  </script>

</body>
</html>
